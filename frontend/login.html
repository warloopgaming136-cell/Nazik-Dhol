<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Nazik Dhol</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23d4af37%22/></svg>">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="page-loader"><svg class="loader-drum" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="44" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="180 100" stroke-linecap="round"/></svg></div>

<div id="site-header"></div>

<div class="auth-wrap">
  <div style="width:100%; max-width:440px; z-index:1;">
    <div class="auth-head">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f3d576"/><stop offset="50%" stop-color="#d4af37"/><stop offset="100%" stop-color="#9c7a1e"/></linearGradient></defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ag)" stroke-width="3"/>
        <ellipse cx="50" cy="32" rx="34" ry="12" fill="none" stroke="url(#ag)" stroke-width="3"/>
        <ellipse cx="50" cy="68" rx="34" ry="12" fill="none" stroke="url(#ag)" stroke-width="3"/>
        <path d="M16 32 L16 68 M84 32 L84 68" stroke="url(#ag)" stroke-width="3"/>
      </svg>
      <h1>Welcome Back</h1>
      <p id="loginDesc">Login to manage your bookings with Nazik Dhol</p>
    </div>

    <div class="glass-card form-panel" style="padding-top: 0; overflow: hidden; z-index: 1; position: relative;">
      <div class="login-tabs">
        <button type="button" class="login-tab active" id="tabCustomer">Customer Login</button>
        <button type="button" class="login-tab" id="tabAdmin">Admin Login</button>
      </div>

      <form id="loginForm">
        <div class="form-group floating-group">
          <input type="email" id="loginEmail" class="form-control" placeholder=" " required>
          <label for="loginEmail">Email</label>
        </div>
        <div class="form-group floating-group password-group">
          <input type="password" id="loginPassword" class="form-control" placeholder=" " required>
          <label for="loginPassword">Password</label>
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div class="form-foot">
          <label class="form-check"><input type="checkbox" id="rememberMe"> Remember Me</label>
          <a href="/forgot-password.html">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4">Login <i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p id="registerPrompt" class="text-center mt-2" style="color:var(--muted); font-size:0.88rem;">Don't have an account? <a href="/register.html" style="color:var(--gold);">Register here</a></p>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
