<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Now | Nazik Dhol</title>
<meta name="description" content="Book Nazik Dhol for your wedding, reception, festival or corporate event.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23d4af37%22/></svg>">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="page-loader"><svg class="loader-drum" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="44" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="180 100" stroke-linecap="round"/></svg></div>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container reveal">
    <p class="crumb"><a href="/index.html">Home</a> / Booking</p>
    <h1>Book Your Event</h1>
    <p>Fill in the details below and our team will confirm your booking within 24 hours.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    
    <!-- If Logged Out: Show Warning & Redirect Card -->
    <div class="glass-card form-panel reveal" id="loggedOutCard" style="display: none; max-width: 500px; margin: 0 auto; text-align: center; padding: 50px 30px;">
      <i class="fa-solid fa-user-lock" style="font-size: 3rem; color: var(--gold); margin-bottom: 20px;"></i>
      <h3 style="font-family: var(--font-heading); margin-bottom: 12px;">Authentication Required</h3>
      <p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 30px; line-height: 1.6;">You must have a customer account to schedule dhol entries and manage bookings.</p>
      <div style="display: flex; gap: 16px; justify-content: center;">
        <a href="/login.html" class="btn btn-primary">Login Now</a>
        <a href="/register.html" class="btn btn-outline">Register</a>
      </div>
    </div>

    <!-- If Logged In: Show Booking Form -->
    <div class="glass-card form-panel wide reveal" id="bookingFormCard" style="display: none;">
      <form id="bookingForm">
        <div class="form-row">
          <div class="form-group floating-group">
            <input type="text" id="bkName" class="form-control" placeholder=" " readonly>
            <label for="bkName">Full Name</label>
          </div>
          <div class="form-group floating-group">
            <input type="tel" id="bkPhone" class="form-control" placeholder=" " readonly>
            <label for="bkPhone">Phone Number</label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group floating-group">
            <input type="email" id="bkEmail" class="form-control" placeholder=" " readonly>
            <label for="bkEmail">Email Address</label>
          </div>
          <div class="form-group floating-group">
            <input type="text" id="bkAddress" class="form-control" placeholder=" " required>
            <label for="bkAddress">Full Address</label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group floating-group">
            <select id="bkEventType" class="form-control" placeholder=" " required style="height: 52px;"></select>
            <label for="bkEventType">Event Type / Service</label>
          </div>
          <div class="form-group floating-group">
            <select id="bkPackage" class="form-control" placeholder=" " required style="height: 52px;"></select>
            <label for="bkPackage">Select Package</label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group floating-group">
            <input type="date" id="bkDate" class="form-control" placeholder=" " required style="height: 52px;">
            <label for="bkDate">Event Date</label>
          </div>
          <div class="form-group floating-group">
            <select id="bkTime" class="form-control" required style="height: 52px;">
              <option value="" disabled selected hidden></option>
              <optgroup label="🌅 Morning Sessions">
                <option value="06:00 AM - 09:00 AM">06:00 AM - 09:00 AM (Early Muhurtham / Procession)</option>
                <option value="08:00 AM - 11:00 AM">08:00 AM - 11:00 AM (Morning Welcome / Pooja)</option>
                <option value="09:00 AM - 12:00 PM">09:00 AM - 12:00 PM (Temple Festival / Opening)</option>
                <option value="10:00 AM - 01:00 PM">10:00 AM - 01:00 PM (Mid-Day Grand Entry)</option>
              </optgroup>
              <optgroup label="☀️ Afternoon Sessions">
                <option value="12:00 PM - 03:00 PM">12:00 PM - 03:00 PM (Lunch Reception / Function)</option>
                <option value="03:00 PM - 06:00 PM">03:00 PM - 06:00 PM (Afternoon Welcome Beats)</option>
              </optgroup>
              <optgroup label="🌙 Prime Evening & Night Gala">
                <option value="05:00 PM - 08:00 PM">05:00 PM - 08:00 PM (Evening Baraat Entry)</option>
                <option value="06:00 PM - 09:00 PM">06:00 PM - 09:00 PM (Prime Reception Celebration)</option>
                <option value="07:00 PM - 10:00 PM">07:00 PM - 10:00 PM (Dinner & Stage Welcome)</option>
                <option value="08:00 PM - 11:00 PM">08:00 PM - 11:00 PM (Night Celebration / DJ Fusion)</option>
                <option value="09:00 PM - 12:00 AM">09:00 PM - 12:00 AM (Midnight Sangeet / DJ Night)</option>
              </optgroup>
              <optgroup label="✨ Special & Custom">
                <option value="Full Day (Flexible Hours)">Full Day Performance (Flexible Timing)</option>
                <option value="custom">Custom Time (Pick Specific Hours)...</option>
              </optgroup>
            </select>
            <label for="bkTime">Event Time Slot</label>
          </div>
        </div>

        <!-- Custom Time Picker (revealed when 'custom' is selected) -->
        <div id="customTimeWrapper" style="display: none; margin-top: -10px; margin-bottom: 22px;">
          <div style="background: rgba(212, 175, 55, 0.05); border: 1px dashed rgba(212, 175, 55, 0.4); border-radius: 12px; padding: 14px 18px;">
            <div style="font-size: 0.78rem; font-family: var(--font-heading); color: var(--gold); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px;">
              <i class="fa-regular fa-clock"></i> Select Your Custom Start & End Time:
            </div>
            <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
              <div style="flex: 1; min-width: 140px;">
                <label style="font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 4px; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 0.06em;">Start Time</label>
                <input type="time" id="bkStartTime" class="form-control" style="height: 46px;">
              </div>
              <span style="color: var(--gold); font-weight: 700; padding-top: 18px;">to</span>
              <div style="flex: 1; min-width: 140px;">
                <label style="font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 4px; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 0.06em;">End Time</label>
                <input type="time" id="bkEndTime" class="form-control" style="height: 46px;">
              </div>
            </div>
          </div>
        </div>

        <div class="form-group floating-group">
          <input type="text" id="bkVenue" class="form-control" placeholder=" " required>
          <label for="bkVenue">Event Venue / Location</label>
        </div>

        <div class="form-group floating-group">
          <textarea id="bkSpecial" class="form-control" placeholder=" " style="min-height: 100px;"></textarea>
          <label for="bkSpecial">Special Requirements / Instructions</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-4" id="bkSubmitBtn">Submit Booking Request</button>
      </form>
    </div>

  </div>
</section>

<div id="site-footer"></div>

<script src="/js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const user = getStoredUser();
    
    // Redirect/Display checks
    if (!user || user.role !== 'user') {
      document.getElementById('loggedOutCard').style.display = 'block';
      return;
    }
    
    // Show booking card
    document.getElementById('bookingFormCard').style.display = 'block';
    
    // Pre-fill user data
    document.getElementById('bkName').value = user.name;
    document.getElementById('bkPhone').value = user.phone || '';
    document.getElementById('bkEmail').value = user.email || '';
    
    const dateInput = document.getElementById('bkDate');
    if (dateInput) dateInput.min = new Date().toISOString().split('T')[0];

    // Populate services and packages dynamically
    const serviceSelect = document.getElementById('bkEventType');
    const packageSelect = document.getElementById('bkPackage');
    
    try {
      const [servicesRes, packagesRes] = await Promise.all([
        api('/services', { auth: false }),
        api('/packages', { auth: false })
      ]);
      
      serviceSelect.innerHTML = servicesRes.data.map(s => `<option value="${s.title}">${s.title}</option>`).join('');
      packageSelect.innerHTML = packagesRes.data.map(p => `<option value="${p._id}" data-name="${p.name}">${p.name} — ₹${p.price.toLocaleString()}</option>`).join('');

      // Pre-select from query params (e.g. ?service=Wedding)
      const urlParams = new URLSearchParams(window.location.search);
      const preService = urlParams.get('service');
      if (preService && serviceSelect.querySelector(`option[value="${preService}"]`)) {
        serviceSelect.value = preService;
      }
      const prePackage = urlParams.get('package');
      if (prePackage && packageSelect.querySelector(`option[value="${prePackage}"]`)) {
        packageSelect.value = prePackage;
      }
    } catch (e) {
      toast('Failed to load list details: ' + e.message, 'error');
    }

    // Time slot toggle for custom slot
    const timeSelect = document.getElementById('bkTime');
    const customTimeWrapper = document.getElementById('customTimeWrapper');
    const startTimeInput = document.getElementById('bkStartTime');
    const endTimeInput = document.getElementById('bkEndTime');

    timeSelect.addEventListener('change', () => {
      if (timeSelect.value === 'custom') {
        customTimeWrapper.style.display = 'block';
        startTimeInput.required = true;
        endTimeInput.required = true;
      } else {
        customTimeWrapper.style.display = 'none';
        startTimeInput.required = false;
        endTimeInput.required = false;
      }
    });

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const [h, m] = timeStr.split(':').map(Number);
      const period = h >= 12 ? 'PM' : 'AM';
      const hours12 = h % 12 || 12;
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(hours12)}:${pad(m)} ${period}`;
    }
    
    // Submit handler
    const form = document.getElementById('bookingForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('bkSubmitBtn');
      
      let eventTimeVal = timeSelect.value;
      if (eventTimeVal === 'custom') {
        const startVal = startTimeInput.value;
        const endVal = endTimeInput.value;
        if (!startVal || !endVal) {
          toast('Please choose both start time and end time for your custom slot.', 'error');
          return;
        }
        eventTimeVal = `${formatTime12(startVal)} - ${formatTime12(endVal)}`;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';
      
      try {
        const payload = {
          customerName:        document.getElementById('bkName').value.trim(),
          phone:               document.getElementById('bkPhone').value.trim(),
          email:               document.getElementById('bkEmail').value.trim(),
          address:             document.getElementById('bkAddress').value.trim(),
          eventType:           serviceSelect.value,
          eventDate:           document.getElementById('bkDate').value,
          eventTime:           eventTimeVal,
          venue:               document.getElementById('bkVenue').value.trim(),
          package:             packageSelect.value || undefined,
          packageName:         packageSelect.selectedOptions[0]?.dataset.name || '',
          specialRequirements: document.getElementById('bkSpecial').value.trim()
        };

        await api('/bookings', {
          method: 'POST',
          body: payload
        });
        
        toast('Booking request submitted! We will email you the confirmation.', 'success');
        form.reset();
        
        // Wait and route to customer bookings tab
        setTimeout(() => {
          window.location.href = '/dashboard.html#upcoming';
        }, 1200);
        
      } catch (err) {
        toast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Submit Booking Request';
      }
    });
  });
</script>
</body>
</html>
