<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Dates | Nazik Dhol</title>
<meta name="description" content="View calendar availability for Nazik Dhol bookings. Check open dates before submitting your request.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23d4af37%22/></svg>">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="page-loader"><svg class="loader-drum" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="44" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="180 100" stroke-linecap="round"/></svg></div>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container reveal">
    <p class="crumb"><a href="/index.html">Home</a> / Calendar</p>
    <h1>Check Event Availability</h1>
    <p>Review our calendar availability status before planning your booking entries.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="glass-card reveal" style="max-width: 700px; margin: 0 auto; padding: 40px; border: 1px solid var(--glass-border);">
      <h3 style="font-family: var(--font-heading); margin-bottom: 24px; text-align: center; color: var(--gold);"><i class="fa-solid fa-calendar-check" style="margin-right: 8px;"></i> Availability Blocks</h3>
      <div id="calendarDisplay" style="display: flex; flex-direction: column; gap: 14px;"></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/js/main.js"></script>
<script>
  async function loadCalendar() {
    const mount = document.getElementById('calendarDisplay');
    if (!mount) return;
    mount.innerHTML = '<div class="text-center" style="padding: 20px;"><i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--gold);"></i></div>';
    
    try {
      const { data } = await api('/dates', { auth: false });
      if (!data || !data.length) {
        mount.innerHTML = '<div class="text-center" style="color: var(--muted); padding: 20px;">All upcoming dates are currently open for booking!</div>';
        return;
      }
      mount.innerHTML = data.map((d) => {
        const dateStr = new Date(d.date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const badgeClass = d.status === 'booked' ? 'badge-status rejected' : 'badge-status pending';
        const statusText = d.status === 'booked' ? 'Fully Booked' : 'Limited Slots';
        return `
          <div class="glass-card" style="padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(244,234,217,0.02); border: 1px solid rgba(244,234,217,0.06);">
            <div>
              <strong style="color: var(--cream); font-size: 0.95rem;">${dateStr}</strong>
              ${d.note ? `<p style="font-size: 0.8rem; color: var(--muted); margin-top: 4px;">${d.note}</p>` : ''}
            </div>
            <span class="${badgeClass}">${statusText}</span>
          </div>
        `;
      }).join('');
    } catch (err) {
      mount.innerHTML = `<div class="text-center" style="color: var(--danger); padding: 20px;">Failed to load calendar status: ${err.message}</div>`;
    }
  }
  
  document.addEventListener('DOMContentLoaded', loadCalendar);
</script>
</body>
</html>
