<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Nazik Dhol</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23d4af37%22/></svg>">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="page-loader"><svg class="loader-drum" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="44" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="180 100" stroke-linecap="round"/></svg></div>

<div id="site-header"></div>

<div class="auth-wrap">
  <div style="width:100%; max-width:440px; z-index:1;">
    <div class="auth-head">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="ag3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f3d576"/><stop offset="50%" stop-color="#d4af37"/><stop offset="100%" stop-color="#9c7a1e"/></linearGradient></defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ag3)" stroke-width="3"/>
        <ellipse cx="50" cy="32" rx="34" ry="12" fill="none" stroke="url(#ag3)" stroke-width="3"/>
        <ellipse cx="50" cy="68" rx="34" ry="12" fill="none" stroke="url(#ag3)" stroke-width="3"/>
        <path d="M16 32 L16 68 M84 32 L84 68" stroke="url(#ag3)" stroke-width="3"/>
      </svg>
      <h1>Reset Your Password</h1>
      <p>Enter your email and we'll send you a reset link</p>
    </div>
    <div class="glass-card form-panel">
      <form id="forgotForm">
        <div class="form-group floating-group">
          <input type="email" id="forgotEmail" class="form-control" placeholder=" " required>
          <label for="forgotEmail">Email Address</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4">Send Reset Link</button>
      </form>
      <p class="text-center mt-2" style="color:var(--muted); font-size:0.88rem;"><a href="/login.html" style="color:var(--gold);"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></p>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
